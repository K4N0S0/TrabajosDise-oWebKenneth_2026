<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Trabajos de Diseño Web</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #1e1e2e; color: #cdd6f4; padding: 40px; }
        h1 { color: #89b4fa; border-bottom: 2px solid #45475a; padding-bottom: 10px; }
        .tree { list-style-type: none; padding-left: 20px; }
        .folder { font-weight: bold; color: #f9e2af; margin-top: 12px; }
        .folder::before { content: "📁 "; }
        .file-container { display: flex; align-items: center; gap: 15px; margin: 6px 0; }
        .file { padding-left: 20px; font-weight: normal; }
        
        /* Íconos según el tipo de archivo */
        .file-html::before { content: "🌐 "; }
        .file-css::before { content: "🎨 "; }
        .file-js::before { content: "⚡ "; }
        .file-generic::before { content: "📄 "; }
        
        a { color: #a6e3a1; text-decoration: none; transition: 0.2s; }
        a:hover { text-decoration: underline; color: #89b4fa; }
        
        /* Botón Eliminar del Árbol */
        .btn-delete-item { background: transparent; border: none; color: #f38ba8; cursor: pointer; font-size: 11px; padding: 2px 6px; border-radius: 4px; transition: 0.2s; }
        .btn-delete-item:hover { background: #585b70; text-decoration: underline; }

        /* Panel de Administrador */
        .admin-panel { margin-top: 80px; padding: 20px; background: #313244; border-radius: 8px; border: 1px dashed #45475a; }
        .admin-title { font-size: 14px; color: #f5e0dc; margin-bottom: 10px; font-weight: bold; }
        .inputs-group { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        input, button { padding: 8px; background: #11111b; border: 1px solid #45475a; color: #cdd6f4; border-radius: 4px; flex: 1; min-width: 150px; }
        button { background: #89b4fa; color: #11111b; cursor: pointer; font-weight: bold; flex: none; }
        textarea { width: 100%; height: 140px; background: #11111b; color: #a6e3a1; font-family: monospace; margin-top: 10px; padding: 10px; border-radius: 4px; border: 1px solid #45475a; box-sizing: border-box; }
        .empty-msg { color: #a6adc8; font-style: italic; padding-left: 20px; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🗄️ Raíz del Servidor: Portafolio de Trabajos</h1>
    
    <!-- ÁRBOL DE CARPETAS -->
    <ul class="tree">
        <li class="folder">Raíz del Proyecto (./)
            <ul id="lista-proyectos" class="tree">
                <!-- Se carga dinámicamente -->
            </ul>
        </li>
    </ul>

    <!-- 🛠️ PANEL GENERADOR MANUAL -->
    <div class="admin-panel" id="panel-control">
        <div class="admin-title">🛠️ Panel de Control: Administrar Servidor (Separado por Comas)</div>
        <p style="font-size: 12px; color: #a6adc8; margin: 0 0 10px 0;">Ingresa tus archivos separados por comas para meter varios de un solo golpe:</p>
        
        <div class="inputs-group">
            <input type="text" id="nueva-carpeta" placeholder="Carpeta (ej: clase1)">
            <input type="text" id="nuevo-archivo" placeholder="Archivos (ej: index.html, estilos.css, script.js)">
            <button onclick="agregarProyecto()">Añadir al Servidor</button>
        </div>

        <div id="output-seccion" style="display:none;">
            <p id="output-instruccion" style="font-size: 12px; color: #f38ba8; margin-top: 10px;">👇 Copia estas líneas y reemplázalas en la sección BASE DE DATOS (Línea 66):</p>
            <textarea id="codigo-output" readonly></textarea>
        </div>
    </div>

    <script>
        // ==========================================
        // 📦 BASE DE DATOS INTERNA (TU PORTAFOLIO)
        // ==========================================
        const MIS_PROYECTOS = [
            { carpeta: "wiki", archivo: "Wikipedia.css" },
            { carpeta: "wiki", archivo: "Wikipedia.html" }
        ];
        // ==========================================

        function obtenerClaseIcono(nombreArchivo) {
            const ext = nombreArchivo.split('.').pop().toLowerCase();
            if (ext === 'html' || ext === 'htm') return 'file-html';
            if (ext === 'css') return 'file-css';
            if (ext === 'js') return 'file-js';
            return 'file-generic';
        }

        // Renderizar el árbol visual agrupado
        function cargarArbol() {
            const container = document.getElementById("lista-proyectos");
            container.innerHTML = "";

            if (MIS_PROYECTOS.length === 0) {
                container.innerHTML = '<li class="empty-msg">El servidor está vacío. Usa el panel de abajo para añadir tu primera carpeta.</li>';
                return;
            }

            const mapaCarpetas = {};
            MIS_PROYECTOS.forEach(p => {
                if (!mapaCarpetas[p.carpeta]) {
                    mapaCarpetas[p.carpeta] = [];
                }
                mapaCarpetas[p.carpeta].push(p.archivo);
            });

            const nombresCarpetasOrdenadas = Object.keys(mapaCarpetas).sort();

            nombresCarpetasOrdenadas.forEach(nomCarpeta => {
                const liFolder = document.createElement("li");
                liFolder.className = "folder";
                liFolder.textContent = nomCarpeta;

                const ulSub = document.createElement("ul");
                ulSub.className = "tree";

                const archivosOrdenados = mapaCarpetas[nomCarpeta].sort();

                archivosOrdenados.forEach(nomArchivo => {
                    const liFileContainer = document.createElement("li");
                    liFileContainer.className = "file-container";

                    const spanFile = document.createElement("span");
                    const claseIcono = obtenerClaseIcono(nomArchivo);
                    spanFile.className = `file ${claseIcono}`;

                    const link = document.createElement("a");
                    link.href = `./${nomCarpeta}/${nomArchivo}`; 
                    link.target = "_blank";
                    link.textContent = nomArchivo;

                    const btnDelete = document.createElement("button");
                    btnDelete.className = "btn-delete-item";
                    btnDelete.textContent = "[Eliminar]";
                    btnDelete.onclick = () => eliminarProyecto(nomCarpeta, nomArchivo);

                    spanFile.appendChild(link);
                    liFileContainer.appendChild(spanFile);
                    
                    if (!window.location.hostname.includes('github.io')) {
                        liFileContainer.appendChild(btnDelete);
                    }
                    ulSub.appendChild(liFileContainer);
                });

                liFolder.appendChild(ulSub);
                container.appendChild(liFolder);
            });
        }

        if (window.location.hostname.includes('github.io')) {
            document.getElementById('panel-control').style.display = 'none';
        }

        function generarTextoCodigo(arreglo) {
            let textoCodigo = "        const MIS_PROYECTOS = [\n";
            arreglo.forEach((p, index) => {
                textoCodigo += `            { carpeta: "${p.carpeta}", archivo: "${p.archivo}" }${index < arreglo.length - 1 ? ',' : ''}\n`;
            });
            textoCodigo += "        ];";
            return textoCodigo;
        }

        // Función con la lógica automática para separar por comas ", "
        function agregarProyecto() {
            const inputCarpeta = document.getElementById("nueva-carpeta").value.trim();
            const inputArchivosRaw = document.getElementById("nuevo-archivo").value.trim();

            if (inputCarpeta === "") {
                alert("Por favor escribe el nombre de la carpeta.");
                return;
            }

            // Si el campo de archivos está vacío, por defecto agregamos index.html
            let listaArchivosAProcesar = ["index.html"];
            
            if (inputArchivosRaw !== "") {
                // El split separa la cadena por cada coma (puede tener espacio o no)
                listaArchivosAProcesar = inputArchivosRaw.split(',').map(item => item.trim()).filter(item => item !== "");
            }

           // Creamos una copia del array actual de la base de datos
            let nuevoArreglo = [...MIS_PROYECTOS];
            let archivosAgregadosContador = 0;

            listaArchivosAProcesar.forEach(nombreArchivo => {
                // Verificar si ya existe el par carpeta-archivo para no duplicar
                const existe = nuevoArreglo.some(p => p.carpeta === inputCarpeta && p.archivo === nombreArchivo);
                if (!existe) {
                    nuevoArreglo.push({ carpeta: inputCarpeta, archivo: nombreArchivo });
                    archivosAgregadosContador++;
                }
            });

            if (archivosAgregadosContador === 0) {
                alert("Todos los archivos ingresados ya estaban registrados en esa carpeta.");
                return;
            }

            // Ordenar alfabéticamente
            nuevoArreglo.sort((a, b) => a.carpeta.localeCompare(b.carpeta) || a.archivo.localeCompare(b.archivo));
            
            document.getElementById("output-instruccion").textContent = `👇 ¡Éxito! Se procesaron ${archivosAgregadosContador} archivo(s). Copia estas líneas y reemplázalas en la línea 66:`;
            document.getElementById("codigo-output").value = generarTextoCodigo(nuevoArreglo);
            document.getElementById("output-seccion").style.display = "block";
            
            document.getElementById("nueva-carpeta").value = "";
            document.getElementById("nuevo-archivo").value = "";
        }

        // Función para eliminar un archivo del árbol
        function eliminarProyecto(carpeta, archivo) {
            if (!confirm(`¿Estás seguro de que quieres quitar "${archivo}" de la carpeta "${carpeta}"?`)) {
                return;
            }

            const nuevoArreglo = MIS_PROYECTOS.filter(p => !(p.carpeta === carpeta && p.archivo === archivo));
            
            document.getElementById("output-instruccion").textContent = "👇 Eliminado del árbol. Copia estas líneas y reemplázalas en la sección BASE DE DATOS (Línea 66) para guardar el cambio:";
            document.getElementById("codigo-output").value = generarTextoCodigo(nuevoArreglo);
            document.getElementById("output-seccion").style.display = "block";
            
            alert("Removido temporalmente. Recuerda sobreescribir el código generado abajo en tu index.html de VS Code.");
        }

        // Inicializar el árbol al cargar la página
        cargarArbol();
    </script>
</body>
</html>
